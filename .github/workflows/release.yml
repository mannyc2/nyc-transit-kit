name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    if: github.repository == 'mannyc2/nyc-transit-kit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.remote-state.outputs.should_release }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out nyc-transit-kit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.17.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Check remote release state
        id: remote-state
        run: bun run release:remote-state --config release.config.json --settle-attempts 36 --settle-delay-ms 5000

      - name: Stop when release already exists
        if: steps.remote-state.outputs.should_release != 'true'
        run: echo "${{ steps.remote-state.outputs.reason }}"

      - name: Run release checks
        if: steps.remote-state.outputs.should_release == 'true'
        run: |
          bun run release:version:check
          bun run check
          bun run build:cli
          bun run release:prepare:npm
          bun run check:npm-stage
          bun run check:release-config
          bun run check:release-ci

      - name: Validate with ts-release
        if: steps.remote-state.outputs.should_release == 'true'
        run: bun run release validate --config release.config.json

      - name: Record release plan
        if: steps.remote-state.outputs.should_release == 'true'
        run: bun run release plan --config release.config.json --format markdown --out .release/evidence/release-plan.md

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-plan-evidence
          path: |
            .release/evidence
            .release/artifacts
            dist
          if-no-files-found: warn

  execute:
    name: Execute release
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out nyc-transit-kit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.17.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Prepare release artifacts
        run: |
          bun run release:version:check
          bun run check
          bun run build:cli
          bun run release:prepare:npm
          bun run check:npm-stage
          bun run check:release-config
          bun run check:release-ci

      - name: Run approved release
        run: |
          if ! bun run release run --config release.config.json --execute --approve-irreversible; then
            echo "Release run failed; checking whether remote state completed after propagation delay."
            bun run release:remote-state --config release.config.json --require-complete --settle-attempts 180 --settle-delay-ms 5000
          fi

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-execution-evidence
          path: |
            .release/evidence
            .release/artifacts
            dist
          if-no-files-found: warn
